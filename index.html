<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stock Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--
  ═══════════════════════════════════════════════════════════════════════════
  這是「殼」，是公開的。

  它刻意只包含：版面樣式、連線設定、以及一個載入器。
  **所有判斷邏輯、規則、參數與資料都不在這個檔案裡** ——
  它們放在你的 private repo，開啟時用你的存取權杖拉下來執行。

  所以：
    · 沒有權杖的人打開這個網址，只會看到一個空的連線畫面
    · 這個檔案裡沒有任何策略內容，公開它不會外洩方法論

  權杖只存在你這台裝置的瀏覽器，不會傳給任何第三方，也不會寫進這個檔案。

  版面完全沿用 Manager Platform：一樣的淺色玻璃背景、漸層頁首、圓形圖示鈕、
  膠囊分頁、玻璃卡片、左側色條卡、KPI 大卡、badge、btn 三態。

  顏色刻意只留四個有作用的 —— 紅漲、綠跌、藍是操作、黃是警示，
  其餘一律中性灰，讓數字和狀態一眼就跳出來。
  紅綠只給價格與多空；「要不要進場」用藍與灰，不然整排「不進場」全變綠色，
  掃過去會被讀成「這些都在跌」。
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  /* 底色與玻璃質感完全沿用 Manager Platform */
  --blue:#1f4e96; --blue2:#2f6fd0;
  --bg:#eef2f7; --card:#fff; --line:#dde4ee;
  --text:#1c2b45; --muted:#6b7a90; --faint:#7b8ca3;

  --ui-blur:28px; --ui-sat:205%;
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.7);
  --glass-line:rgba(255,255,255,.6); --glass-blur:saturate(var(--ui-sat)) blur(var(--ui-blur));
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --shadow-1:0 1px 2px rgba(30,50,90,.06),0 6px 20px rgba(30,50,90,.06);
  --shadow-2:0 8px 30px rgba(30,50,90,.12);

  /* 只有四個有作用的顏色，其餘一律中性。為淺底重新調過對比。 */
  --up:#d6402f;      /* 漲 / 偏多 */
  --down:#12855c;    /* 跌 / 偏空 */
  --act:#2f6fd0;     /* 可以動作 */
  --warn:#a9720a;    /* 警示 */

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro TC","PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;background:#e7ecf6;overscroll-behavior:none}
body{
  font-family:var(--sans);color:var(--text);font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;
  background:
    radial-gradient(1100px 700px at 12% -8%, rgba(47,111,208,.30), transparent 60%),
    radial-gradient(900px 650px at 100% 0%, rgba(179,157,219,.28), transparent 55%),
    radial-gradient(800px 700px at 50% 120%, rgba(54,179,126,.18), transparent 60%),
    linear-gradient(160deg,#eef3fb,#e7ecf6 55%,#eaf1f5);
  background-attachment:fixed;
}
.mono,code{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* ── 頁首 ── */
header{
  background:linear-gradient(120deg,rgba(31,78,150,.78),rgba(47,111,208,.72));
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:70;border-bottom:1px solid rgba(255,255,255,.18);
  box-shadow:0 4px 24px rgba(20,40,80,.18);
}
header h1{font-size:20px;font-weight:800;letter-spacing:.5px}
header .sub{font-size:12px;opacity:.85}
header .spacer{flex:1}
header .hactions{display:flex;align-items:center;gap:2px}
header button{background:transparent;color:#fff;border:none;width:36px;height:36px;padding:0;
  border-radius:50%;cursor:pointer;font-size:18px;line-height:1;display:inline-flex;
  align-items:center;justify-content:center;transition:background .2s,transform .15s}
header button:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
header button:active{transform:scale(.92)}
header button:disabled{opacity:.45;cursor:default;transform:none}
#conn{font-family:var(--mono);font-size:11.5px;color:#fff;background:rgba(255,255,255,.18);
  padding:3px 11px;border-radius:999px;white-space:nowrap}

/* ── 分頁 ── */
nav{display:flex;align-items:center;gap:6px;padding:0 24px;height:44px;overflow-x:auto;
  background:var(--glass);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-line);box-shadow:0 2px 14px rgba(30,50,90,.06);
  position:sticky;top:65px;z-index:60}
nav .tab{padding:6px 16px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);
  border-radius:12px;white-space:nowrap;transition:all .18s;border:none;background:none;
  font-family:inherit;display:inline-flex;align-items:center;gap:7px}
nav .tab:hover{color:var(--blue);background:rgba(255,255,255,.5)}
nav .tab.active{color:#fff;background:linear-gradient(120deg,var(--blue),var(--blue2));
  box-shadow:0 4px 14px rgba(31,78,150,.32)}
nav .tab .n{font-size:11px;font-weight:700;opacity:.75;background:rgba(120,140,170,.18);
  padding:1px 8px;border-radius:999px;font-family:var(--mono)}
nav .tab.active .n{background:rgba(255,255,255,.28);opacity:1}

main{padding:22px 24px 60px;max-width:1400px;margin:0 auto}
.panel{display:none}
.panel.on{display:block}

/* ── 標題 / 卡片 ── */
.section-title{font-size:16px;font-weight:800;margin:6px 0 12px;color:var(--blue);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-title .count{font-size:12px;font-weight:600;color:var(--blue);
  background:rgba(47,111,208,.12);border:1px solid rgba(47,111,208,.18);
  padding:2px 10px;border-radius:999px}
.section-title .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.section-title .hint{font-weight:400}

.card{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);border-radius:var(--r-md);
  padding:16px;box-shadow:var(--shadow-1);transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow-2)}
.pcard{border-left:5px solid var(--faint)}
.pcard.up{border-left-color:var(--up)}
.pcard.down{border-left-color:var(--down)}
.pcard.hold{border-left-color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12px;line-height:1.65}

/* ── KPI 大卡 ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpi{border-radius:var(--r-lg);border:1px solid var(--glass-line);background:var(--glass-strong);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:var(--shadow-1);overflow:hidden;position:relative}
.kpi::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 45%)}
.kpi .k-hd{padding:16px 20px 10px;display:flex;align-items:flex-end;gap:12px;position:relative;z-index:1}
.kpi .k-label{font-size:14px;font-weight:700;color:var(--muted)}
.kpi .k-px{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto}
.kpi .k-verdict{font-size:40px;font-weight:800;line-height:1;letter-spacing:1px}
.kpi .k-why{padding:0 20px 12px;font-size:12px;color:var(--muted);position:relative;z-index:1}
.kpi .k-sigs{border-top:1px solid var(--line);padding:6px 20px 12px;position:relative;z-index:1}
.sig{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:12.5px;
  border-bottom:1px solid rgba(120,140,170,.14)}
.sig:last-child{border-bottom:none}
.sig .k{color:var(--muted);flex:none;width:7em;font-weight:600}
.sig .d{color:var(--faint);font-family:var(--mono);font-size:11.5px;margin-left:auto;text-align:right}

/* ── badge ── */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:3px 11px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.badge.up{background:rgba(214,64,47,.14);color:var(--up);border-color:rgba(214,64,47,.3)}
.badge.down{background:rgba(18,133,92,.14);color:var(--down);border-color:rgba(18,133,92,.3)}
.badge.mid{background:rgba(120,140,170,.14);color:var(--muted);border-color:rgba(120,140,170,.26)}
.badge.warn{background:rgba(169,114,10,.14);color:var(--warn);border-color:rgba(169,114,10,.3)}
.badge.go{background:rgba(47,111,208,.14);color:var(--blue2);border-color:rgba(47,111,208,.3)}

/* ── 按鈕 ── */
.btn{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;border:none;
  padding:8px 16px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;
  font-family:inherit;box-shadow:0 4px 12px rgba(31,78,150,.25);
  transition:transform .15s,box-shadow .2s,filter .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 18px rgba(31,78,150,.32)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none;filter:none}
.btn.ghost{background:var(--glass-strong);color:var(--blue);border:1px solid rgba(31,78,150,.35);
  box-shadow:var(--shadow-1)}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:10px}
.btn.danger{background:var(--glass-strong);color:var(--up);border:1px solid rgba(214,64,47,.5);
  box-shadow:var(--shadow-1)}

/* ── 表單 ── */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:11px;
  font-size:13px;font-family:inherit;background:rgba(255,255,255,.7);color:var(--text);
  transition:border-color .18s,box-shadow .18s,background .18s}
input:focus,select:focus{outline:none;border-color:var(--blue2);background:#fff;
  box-shadow:0 0 0 3px rgba(47,111,208,.18)}
select{cursor:pointer}
:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}

/* ── 表格 ── */
.tw{overflow-x:auto;border:1px solid var(--glass-line);border-radius:var(--r-md);
  background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
th{background:#eef3fb;color:var(--blue);font-size:12px;font-weight:700;position:sticky;top:0}
td{border-top:1px solid #eef2f7}
th.l,td.l{text-align:left}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.nm{font-weight:700}
tbody tr:hover td{background:#f6f9fe}

/* ── 理由展開 ── */
details.rz{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);
  backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);
  border-left:5px solid var(--faint);border-radius:var(--r-md);margin-bottom:10px;
  overflow:hidden;box-shadow:var(--shadow-1)}
/* 左側色條跟 badge 同一套語意（藍＝可動作、灰＝不動作、黃＝留意）。
   刻意不用紅綠 —— 紅綠在台股是漲跌，用在這裡會被誤讀成價格方向。 */
details.rz.go{border-left-color:var(--act)} details.rz.mid{border-left-color:#9fb0c4}
details.rz.warn{border-left-color:var(--warn)}
details.rz>summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:700;
  display:flex;gap:10px;align-items:center;list-style:none;color:var(--text)}
details.rz>summary::-webkit-details-marker{display:none}
details.rz>summary::before{content:"▸";color:var(--faint);font-family:var(--mono);flex:none;font-weight:400}
details.rz[open]>summary::before{content:"▾"}
details.rz[open]>summary{border-bottom:1px solid var(--line)}
.rzbody{padding:14px 16px 16px}
ul.why{list-style:none;font-size:12.5px;margin-bottom:14px}
ul.why li{display:flex;gap:10px;padding:3px 0;align-items:baseline}
ul.why li .p{flex:none;width:3.2em;text-align:right;font-family:var(--mono);font-size:11.5px;font-weight:700}
ul.why li.u .p{color:var(--up)} ul.why li.d .p{color:var(--down)} ul.why li.z .p{color:var(--faint)}
ul.why li .t{color:var(--text)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:12px;
  border-top:1px solid var(--line);padding-top:12px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--text)}

.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.faint{color:var(--faint)} .warn{color:var(--warn)}
.empty{color:var(--muted);text-align:center;padding:40px 16px;font-size:13px;
  border:1px dashed var(--line);border-radius:var(--r-md);background:rgba(255,255,255,.4)}
.note{background:rgba(255,247,230,.8);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid #ffe1a8;color:#8a6d3b;padding:11px 14px;border-radius:var(--r-sm);
  font-size:12.5px;line-height:1.65;margin-bottom:14px}
.note b{color:#6f5527}

#gate{max-width:580px;margin:36px auto}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 12px}
@media (max-width:720px){
  header,nav,main{padding-left:14px;padding-right:14px}
  nav{top:64px}
  .kpi .k-verdict{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div>
    <h1>Stock Agent</h1>
    <div class="sub">台股盤勢與個股分析</div>
  </div>
  <div class="spacer"></div>
  <span id="conn">未連線</span>
  <div class="hactions">
    <button id="btnRefresh" title="請伺服器抓最新行情">↻</button>
    <button id="btnReload" title="重新載入">⟳</button>
    <button id="btnGate" title="連線設定">⚙</button>
  </div>
</header>

<main>
  <div id="gate" hidden>
    <div class="section-title">連線設定<span class="count">資料與邏輯都在你的私有 repo</span></div>
    <div class="card">
      <div class="note">
        這個網頁只是「殼」，本身<b>不含任何邏輯與資料</b>。它會用你的存取權杖，
        到你的<b>私有 repo</b> 取回分析引擎與行情再執行。權杖<b>只存在這台裝置的瀏覽器</b>。
        <br>建議用 <b>fine-grained token</b> 並只授權那一個 repo：
        <code>Contents</code> 與 <code>Actions</code> 都設 Read and write。
        <b>公用電腦請不要勾「記住」。</b>
      </div>
      <div class="grid2">
        <div class="field"><label>擁有者</label><input id="f_owner" placeholder="你的 GitHub 帳號"></div>
        <div class="field"><label>私有 repo</label><input id="f_repo" placeholder="你的私有 repo 名稱"></div>
        <div class="field"><label>分支</label><input id="f_branch" placeholder="main"></div>
      </div>
      <div class="field"><label>存取權杖</label>
        <input id="f_token" type="password" placeholder="github_pat_… 或 ghp_…" autocomplete="off"></div>
      <label class="row" style="font-size:12.5px;color:var(--muted);cursor:pointer;margin-bottom:14px">
        <input type="checkbox" id="f_remember" checked style="width:auto;margin:0"> 在這台裝置記住權杖
      </label>
      <div class="row">
        <button class="btn ghost" id="btnTest">測試連線</button>
        <button class="btn" id="btnSave">儲存並載入</button>
        <button class="btn danger sm" id="btnForget">清除本機權杖</button>
      </div>
      <div id="gateMsg" class="hint" style="margin-top:12px"></div>
    </div>
  </div>

  <div id="app"></div>
</main>

<script>
/* 殼的職責只有三件事：連線設定、GitHub 傳輸、載入私有程式。
   任何跟策略有關的東西都不應該出現在這個檔案裡。 */
const LS = 'mc_conn_v1';
let CONN = {};
try { CONN = JSON.parse(localStorage.getItem(LS) || sessionStorage.getItem(LS) || '{}'); } catch(e){}

const $ = s => document.querySelector(s);
const ready = () => !!(CONN.owner && CONN.repo && CONN.token);
const branch = () => CONN.branch || 'main';
const head = () => {
  const h = {'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if (CONN.token) h.Authorization = 'Bearer ' + CONN.token;
  return h;
};
function b64toStr(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(u8);
}
function strToB64(s){
  const u8 = new TextEncoder().encode(s);
  let bin = ''; const CH = 0x8000;
  for (let i=0;i<u8.length;i+=CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(bin);
}
function conn(kind, msg){
  const n = $('#conn');
  n.style.color = '#fff';
  n.style.background = kind==='err' ? 'rgba(214,64,47,.85)'
                     : kind==='ok'  ? 'rgba(18,133,92,.8)' : 'rgba(255,255,255,.22)';
  n.textContent = msg;
}

async function ghGet(path){
  const url = `https://api.github.com/repos/${CONN.owner}/${CONN.repo}/contents/${path}`
            + `?ref=${encodeURIComponent(branch())}`;
  const r = await fetch(url, {headers: head(), cache:'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}
async function ghText(path){
  const j = await ghGet(path);
  if (!j) return null;
  if (j.content) return b64toStr(j.content);
  if (j.download_url) return (await fetch(j.download_url, {cache:'no-store'})).text();
  return null;
}
async function ghPutText(path, text, message){
  const cur = await ghGet(path);
  const body = { message: message || ('update ' + path), content: strToB64(text), branch: branch() };
  if (cur && cur.sha) body.sha = cur.sha;
  const r = await fetch(`https://api.github.com/repos/${CONN.owner}/${CONN.repo}/contents/${path}`,
    {method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, head()), body: JSON.stringify(body)});
  if (r.status === 409) throw new Error('版本衝突 —— 請按重新載入取得最新版再改一次');
  if (!r.ok) throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0,120)}`);
  return r.json();
}
async function ghDispatch(workflow){
  const r = await fetch(
    `https://api.github.com/repos/${CONN.owner}/${CONN.repo}/actions/workflows/${workflow}/dispatches`,
    {method:'POST', headers: Object.assign({'Content-Type':'application/json'}, head()),
     body: JSON.stringify({ref: branch()})});
  if (r.status === 204) return true;
  if (r.status === 403) throw new Error('403：權杖缺少 Actions 寫入權限');
  throw new Error('HTTP ' + r.status);
}

const CTX = {
  gh: { get: ghGet, text: ghText, putText: ghPutText, dispatch: ghDispatch,
        cfg: () => ({owner:CONN.owner, repo:CONN.repo, branch:branch()}) },
  mount: () => $('#app'),
  conn,
  store: {
    get(k){ try { return JSON.parse(localStorage.getItem('mc_'+k)); } catch(e){ return null; } },
    set(k,v){ localStorage.setItem('mc_'+k, JSON.stringify(v)); }
  }
};

/* 私有程式的進入點。放在 private repo，殼只負責取回並執行。 */
const BUNDLE_PATH = 'app/console-bundle.js';

async function boot(){
  if (!ready()) { showGate(true); conn('warn','未連線'); return; }
  showGate(false);
  conn('warn','⟳ 載入中…');
  $('#app').innerHTML = '<div class="empty">載入中…</div>';
  try{
    const src = await ghText(BUNDLE_PATH);
    if (!src) throw new Error(`私有 repo 找不到 ${BUNDLE_PATH}`);
    await (new Function('CTX', src + '\n;return typeof boot==="function"?boot(CTX):null;'))(CTX);
    conn('ok','已連線');
  }catch(e){
    conn('err','⚠ ' + e.message);
    $('#app').innerHTML = '<div class="empty">載入失敗：' + String(e.message).replace(/</g,'&lt;')
      + '<br><br>檢查權杖是否有這個 repo 的 Contents 讀取權限。</div>';
  }
}

function showGate(on){
  $('#gate').hidden = !on;
  $('#app').hidden = on;
  if (on){
    $('#f_owner').value  = CONN.owner  || '';
    $('#f_repo').value   = CONN.repo   || '';
    $('#f_branch').value = CONN.branch || 'main';
    $('#f_token').value  = CONN.token  || '';
  }
}

$('#btnGate').onclick = () => showGate($('#gate').hidden);

$('#btnTest').onclick = async () => {
  const m = $('#gateMsg');
  const owner = $('#f_owner').value.trim(), repo = $('#f_repo').value.trim(), token = $('#f_token').value.trim();
  if (!owner || !repo || !token){ m.className='hint warn'; m.textContent='⚠ 請先填擁有者 / repo / 權杖'; return; }
  m.className='hint warn'; m.textContent='⟳ 測試中…';
  try{
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`,
      {headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token}, cache:'no-store'});
    if (r.ok){ const j = await r.json();
      m.className='hint down'; m.textContent = `✅ 連線成功：${j.full_name}（${j.private?'private':'public'}）`; }
    else if (r.status===401){ m.className='hint warn'; m.textContent='⚠ 401：權杖無效或已過期'; }
    else if (r.status===404){ m.className='hint warn'; m.textContent='⚠ 404：repo 不存在，或權杖沒有這個 repo 的權限'; }
    else { m.className='hint warn'; m.textContent='⚠ HTTP ' + r.status; }
  }catch(e){ m.className='hint warn'; m.textContent='⚠ ' + e.message; }
};

$('#btnSave').onclick = async () => {
  CONN = { owner:$('#f_owner').value.trim(), repo:$('#f_repo').value.trim(),
           branch:$('#f_branch').value.trim() || 'main', token:$('#f_token').value.trim() };
  const store = $('#f_remember').checked ? localStorage : sessionStorage;
  const other = $('#f_remember').checked ? sessionStorage : localStorage;
  other.removeItem(LS);
  store.setItem(LS, JSON.stringify(CONN));
  await boot();
};

$('#btnForget').onclick = () => {
  localStorage.removeItem(LS); sessionStorage.removeItem(LS);
  CONN = {}; $('#app').innerHTML = '';
  showGate(true); conn('warn','已清除');
  $('#gateMsg').className='hint'; $('#gateMsg').textContent='本機權杖已清除。';
};

$('#btnReload').onclick = boot;

$('#btnRefresh').onclick = async () => {
  if (!ready()){ showGate(true); return; }
  const b = $('#btnRefresh'); b.disabled = true;
  conn('warn','⟳ 已送出抓取請求…');
  try{
    await ghDispatch('fetch-market-data.yml');
    conn('ok','抓取中，1–2 分鐘後按 ⟳');
  }catch(e){ conn('err','⚠ ' + e.message); }
  finally{ b.disabled = false; }
};

boot();
</script>
</body>
</html>
