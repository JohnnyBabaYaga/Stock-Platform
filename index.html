<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>盤勢工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!--
  ═══════════════════════════════════════════════════════════════════════════
  這是「殼」，是公開的。

  它刻意只包含：版面樣式、連線設定、以及一個載入器。
  **所有判斷邏輯、規則、參數與資料都不在這個檔案裡** ——
  它們放在你的 private repo，開啟時用你的存取權杖拉下來執行。

  所以：
    · 沒有權杖的人打開這個網址，只會看到一個空的連線畫面
    · 這個檔案裡沒有任何策略內容，公開它不會外洩方法論

  權杖只存在你這台裝置的瀏覽器（localStorage），不會傳給任何第三方，
  也不會寫進這個檔案。
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ground:#0d1319; --panel:#151d26; --raise:#1d2833; --rule:#27343f;
  --ink:#e2eaf1; --ink-dim:#8494a3; --ink-faint:#5a6875;
  --up:#f4574c; --down:#2ebd85; --warn:#d9a441; --act:#4d8bf0;
  --sans:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.mono,code{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;font-family:var(--sans);cursor:pointer;border-radius:6px;
  border:1px solid var(--rule);background:var(--raise);color:var(--ink);padding:7px 13px;
  transition:border-color .15s,background .15s}
button:hover{border-color:var(--act)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--act);outline-offset:2px}
button.act{background:var(--act);border-color:var(--act);color:#08131f;font-weight:700}
button.quiet{background:transparent;color:var(--ink-dim)}
button.quiet:hover{color:var(--up);border-color:var(--up)}
input,select{font:inherit;font-family:var(--sans);background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;padding:7px 10px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--act)}
label{display:block;font-size:11.5px;letter-spacing:.4px;color:var(--ink-faint);margin-bottom:4px}

.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}
.top{border-bottom:1px solid var(--rule);background:var(--panel)}
.top .wrap{padding:16px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:700;letter-spacing:.6px}
.top .sp{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#conn{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}

section{margin-bottom:26px}
.shd{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid var(--rule)}
.shd h2{font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase}
.shd .sub{font-size:12px;color:var(--ink-faint)}
.shd .r{margin-left:auto}
.card{border:1px solid var(--rule);border-radius:10px;background:var(--panel);padding:16px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.hint{color:var(--ink-faint);font-size:12px;line-height:1.65}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}

.regime{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.idx{border:1px solid var(--rule);border-radius:10px;background:var(--panel);overflow:hidden}
.idx .hd{display:flex;align-items:baseline;gap:10px;padding:12px 15px 10px}
.idx .nm{font-weight:500;font-size:13px;color:var(--ink-dim)}
.idx .px{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink-dim)}
.idx .verdict{font-size:24px;font-weight:700;letter-spacing:1px}
.idx .why{padding:0 15px 10px;font-size:12px;color:var(--ink-faint)}
.idx .sigs{border-top:1px solid var(--rule);padding:4px 15px 10px}
.sig{display:flex;gap:10px;align-items:baseline;padding:5px 0;font-size:12px;
  border-bottom:1px solid rgba(39,52,63,.55)}
.sig:last-child{border-bottom:none}
.sig .k{color:var(--ink-dim);flex:none;width:6.5em}
.sig .d{color:var(--ink-faint);font-family:var(--mono);font-size:11.5px;margin-left:auto;text-align:right}

.pill{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:3px;letter-spacing:.5px}
.pill.b{background:rgba(244,87,76,.16);color:var(--up);box-shadow:inset 0 0 0 1px rgba(244,87,76,.4)}
.pill.s{background:rgba(46,189,133,.16);color:var(--down);box-shadow:inset 0 0 0 1px rgba(46,189,133,.4)}
.pill.n{background:rgba(132,148,163,.12);color:var(--ink-dim);box-shadow:inset 0 0 0 1px rgba(132,148,163,.3)}
.pill.w{background:rgba(217,164,65,.16);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(217,164,65,.4)}

.adopt{border:1px solid var(--rule);border-left:3px solid var(--act);border-radius:8px;
  background:var(--panel);padding:11px 15px;font-size:12.5px;color:var(--ink-dim);margin-bottom:26px}
.adopt b{color:var(--ink)}

.tw{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--rule)}
th{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;background:var(--raise)}
th.l,td.l{text-align:left}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--raise)}
.score{font-family:var(--mono);font-weight:600}

details.rz{border:1px solid var(--rule);border-radius:10px;background:var(--panel);margin-bottom:10px;overflow:hidden}
details.rz>summary{cursor:pointer;padding:12px 16px;font-size:13px;font-weight:500;
  display:flex;gap:10px;align-items:center;list-style:none}
details.rz>summary::-webkit-details-marker{display:none}
details.rz>summary::before{content:"▸";color:var(--ink-faint);font-family:var(--mono);flex:none}
details.rz[open]>summary::before{content:"▾"}
details.rz[open]>summary{border-bottom:1px solid var(--rule)}
.rzbody{padding:14px 16px 16px}
ul.why{margin:0 0 14px;padding-left:0;list-style:none;font-size:12.5px}
ul.why li{display:flex;gap:10px;padding:3px 0;align-items:baseline}
ul.why li .p{flex:none;width:3.2em;text-align:right;font-family:var(--mono);font-size:11.5px}
ul.why li.up .p{color:var(--up)} ul.why li.dn .p{color:var(--down)} ul.why li.z .p{color:var(--ink-faint)}
ul.why li .t{color:var(--ink-dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;font-size:12px;
  border-top:1px solid var(--rule);padding-top:12px}
.kv .k{color:var(--ink-faint)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-dim)}

.up{color:var(--up)} .dn{color:var(--down)} .dim{color:var(--ink-dim)} .warn{color:var(--warn)}
.ok{color:var(--down)}
.empty{color:var(--ink-faint);text-align:center;padding:34px 14px;font-size:13px;
  border:1px dashed var(--rule);border-radius:10px}
.note{border:1px solid #4a3a16;background:#1d1809;border-radius:8px;padding:12px 14px;
  font-size:12.5px;line-height:1.65;color:#e0c07a;margin-bottom:18px}
.note b{color:#f0d79a}
#gate{max-width:560px;margin:44px auto}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <h1>盤勢工作台</h1>
  <div class="sp">
    <span id="conn">未連線</span>
    <button id="btnRefresh" title="請伺服器抓最新行情">更新行情</button>
    <button id="btnReload">重新載入</button>
    <button class="quiet" id="btnGate">連線設定</button>
  </div>
</div></div>

<div class="wrap">
  <div id="gate" hidden>
    <div class="shd"><h2>連線設定</h2><span class="sub">資料與邏輯都存在你的私有 repo</span></div>
    <div class="card">
      <div class="note">
        這個網頁只是「殼」，本身<b>不含任何邏輯與資料</b>。
        它會用你的存取權杖，到你的<b>私有 repo</b> 取回分析引擎與行情再執行。
        權杖<b>只存在這台裝置的瀏覽器</b>，不會傳給第三方。
        <br>建議用 <b>fine-grained token</b> 並只授權這一個 repo：
        <code>Contents: Read and write</code>、<code>Actions: Read and write</code>。
        <b>公用電腦請不要勾「記住」。</b>
      </div>
      <div class="grid">
        <div><label>擁有者</label><input id="f_owner" placeholder="你的 GitHub 帳號"></div>
        <div><label>私有 repo</label><input id="f_repo" placeholder="你的私有 repo 名稱"></div>
        <div><label>分支</label><input id="f_branch" placeholder="main"></div>
      </div>
      <div style="margin-top:12px"><label>存取權杖</label>
        <input id="f_token" type="password" placeholder="github_pat_… 或 ghp_…" autocomplete="off"></div>
      <label style="margin-top:12px;display:flex;gap:7px;align-items:center;color:var(--ink-dim);font-size:12.5px">
        <input type="checkbox" id="f_remember" checked style="width:auto"> 在這台裝置記住權杖
      </label>
      <div class="row" style="margin-top:14px">
        <button id="btnTest">測試連線</button>
        <button class="act" id="btnSave">儲存並載入</button>
        <button class="quiet" id="btnForget">清除本機權杖</button>
      </div>
      <div id="gateMsg" class="hint" style="margin-top:10px"></div>
    </div>
  </div>

  <div id="app"></div>
</div>

<script>
/* 殼的職責只有三件事：連線設定、GitHub 傳輸、載入私有程式。
   任何跟策略有關的東西都不應該出現在這個檔案裡。 */
const LS = 'mc_conn_v1';
let CONN = {};
try { CONN = JSON.parse(localStorage.getItem(LS) || sessionStorage.getItem(LS) || '{}'); } catch(e){}

const $ = s => document.querySelector(s);
const ready = () => !!(CONN.owner && CONN.repo && CONN.token);
const branch = () => CONN.branch || 'main';
const head = () => {
  const h = {'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
  if (CONN.token) h.Authorization = 'Bearer ' + CONN.token;
  return h;
};
function b64toStr(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const u8 = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(u8);
}
function strToB64(s){
  const u8 = new TextEncoder().encode(s);
  let bin = ''; const CH = 0x8000;
  for (let i=0;i<u8.length;i+=CH) bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH));
  return btoa(bin);
}
function conn(kind, msg){
  const n = $('#conn');
  n.style.color = kind==='err' ? 'var(--up)' : kind==='ok' ? 'var(--down)' : 'var(--warn)';
  n.textContent = msg;
}

async function ghGet(path){
  const url = `https://api.github.com/repos/${CONN.owner}/${CONN.repo}/contents/${path}`
            + `?ref=${encodeURIComponent(branch())}`;
  const r = await fetch(url, {headers: head(), cache:'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}
async function ghText(path){
  const j = await ghGet(path);
  if (!j) return null;
  // 檔案超過 Contents API 的 inline 上限時 content 會是空的，改走 download_url
  if (j.content) return b64toStr(j.content);
  if (j.download_url) return (await fetch(j.download_url, {cache:'no-store'})).text();
  return null;
}
async function ghPutText(path, text, message){
  const cur = await ghGet(path);
  const body = { message: message || ('update ' + path), content: strToB64(text), branch: branch() };
  if (cur && cur.sha) body.sha = cur.sha;
  const r = await fetch(`https://api.github.com/repos/${CONN.owner}/${CONN.repo}/contents/${path}`,
    {method:'PUT', headers: Object.assign({'Content-Type':'application/json'}, head()), body: JSON.stringify(body)});
  if (r.status === 409) throw new Error('版本衝突 —— 請按「重新載入」取得最新版再改一次');
  if (!r.ok) throw new Error(`HTTP ${r.status} ${(await r.text()).slice(0,120)}`);
  return r.json();
}
async function ghDispatch(workflow){
  const r = await fetch(
    `https://api.github.com/repos/${CONN.owner}/${CONN.repo}/actions/workflows/${workflow}/dispatches`,
    {method:'POST', headers: Object.assign({'Content-Type':'application/json'}, head()),
     body: JSON.stringify({ref: branch()})});
  if (r.status === 204) return true;
  if (r.status === 403) throw new Error('403：權杖缺少 Actions 寫入權限');
  throw new Error('HTTP ' + r.status);
}

const CTX = {
  gh: { get: ghGet, text: ghText, putText: ghPutText, dispatch: ghDispatch,
        cfg: () => ({owner:CONN.owner, repo:CONN.repo, branch:branch()}) },
  mount: () => $('#app'),
  conn,
  store: {
    get(k){ try { return JSON.parse(localStorage.getItem('mc_'+k)); } catch(e){ return null; } },
    set(k,v){ localStorage.setItem('mc_'+k, JSON.stringify(v)); }
  }
};

/* 私有程式的進入點。放在 private repo，殼只負責取回並執行。 */
const BUNDLE_PATH = 'app/console-bundle.js';
let booted = false;

async function boot(){
  if (!ready()) { showGate(true); conn('warn','未連線'); return; }
  showGate(false);
  conn('warn','⟳ 載入中…');
  $('#app').innerHTML = '<div class="empty">載入中…</div>';
  try{
    const src = await ghText(BUNDLE_PATH);
    if (!src) throw new Error(`私有 repo 找不到 ${BUNDLE_PATH}`);
    // 這是你自己 private repo 裡的程式，用你自己的權杖取回
    await (new Function('CTX', src + '\n;return typeof boot==="function"?boot(CTX):null;'))(CTX);
    booted = true;
    conn('ok','☁ 已連線');
  }catch(e){
    conn('err','⚠ ' + e.message);
    $('#app').innerHTML = '<div class="empty">載入失敗：' + String(e.message).replace(/</g,'&lt;')
      + '<br><br>檢查權杖是否有這個 repo 的 Contents 讀取權限。</div>';
  }
}

function showGate(on){
  $('#gate').hidden = !on;
  $('#app').hidden = on;
  if (on){
    $('#f_owner').value  = CONN.owner  || '';
    $('#f_repo').value   = CONN.repo   || '';
    $('#f_branch').value = CONN.branch || 'main';
    $('#f_token').value  = CONN.token  || '';
  }
}

$('#btnGate').onclick = () => showGate($('#gate').hidden);

$('#btnTest').onclick = async () => {
  const m = $('#gateMsg');
  const owner = $('#f_owner').value.trim(), repo = $('#f_repo').value.trim(), token = $('#f_token').value.trim();
  if (!owner || !repo || !token){ m.className='hint warn'; m.textContent='⚠ 請先填擁有者 / repo / 權杖'; return; }
  m.className='hint warn'; m.textContent='⟳ 測試中…';
  try{
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`,
      {headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+token}, cache:'no-store'});
    if (r.ok){ const j = await r.json();
      m.className='hint ok'; m.textContent = `✅ 連線成功：${j.full_name}（${j.private?'private':'public'}）`; }
    else if (r.status===401){ m.className='hint warn'; m.textContent='⚠ 401：權杖無效或已過期'; }
    else if (r.status===404){ m.className='hint warn'; m.textContent='⚠ 404：repo 不存在，或權杖沒有這個 repo 的權限'; }
    else { m.className='hint warn'; m.textContent='⚠ HTTP ' + r.status; }
  }catch(e){ m.className='hint warn'; m.textContent='⚠ ' + e.message; }
};

$('#btnSave').onclick = async () => {
  CONN = { owner:$('#f_owner').value.trim(), repo:$('#f_repo').value.trim(),
           branch:$('#f_branch').value.trim() || 'main', token:$('#f_token').value.trim() };
  const store = $('#f_remember').checked ? localStorage : sessionStorage;
  const other = $('#f_remember').checked ? sessionStorage : localStorage;
  other.removeItem(LS);
  store.setItem(LS, JSON.stringify(CONN));
  await boot();
};

$('#btnForget').onclick = () => {
  localStorage.removeItem(LS); sessionStorage.removeItem(LS);
  CONN = {}; booted = false; $('#app').innerHTML = '';
  showGate(true); conn('warn','已清除，未連線');
  $('#gateMsg').className='hint'; $('#gateMsg').textContent='本機權杖已清除。';
};

$('#btnReload').onclick = boot;

$('#btnRefresh').onclick = async () => {
  if (!ready()){ showGate(true); return; }
  const b = $('#btnRefresh'); b.disabled = true;
  conn('warn','⟳ 已送出抓取請求…');
  try{
    await ghDispatch('fetch-market-data.yml');
    conn('ok','✓ 抓取中，約 1–2 分鐘後按「重新載入」');
  }catch(e){ conn('err','⚠ ' + e.message); }
  finally{ b.disabled = false; }
};

boot();
</script>
</body>
</html>
